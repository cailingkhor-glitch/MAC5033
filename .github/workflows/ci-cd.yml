
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: helm/kind-action@v1
        with:
          cluster_name: demo

      - name: Pull the image and load it into the cluster
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name demo

      - name: Deploy the manifest
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/mac5033 --timeout=120s

      - name: Smoke test
        run: |
          kubectl port-forward svc/mac5033 8080:80 &
          sleep 5
          curl --fail --silent http://localhost:8080/health

  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Simulated production deploy
        run: |
          echo "Approved. A real pipeline would now deploy ${{ needs.build-and-push.outputs.image }} to production."
